<!DOCTYPE html>
<html lang="ja"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>はじめてのかけざん①かけ算のいみを知ろう</title>
<style>
:root{--bg:#fffbea;--card:#fff;--tx:#333;--blue:#06a9ec;--lb:#9bd9ec;--pk:#ffd9de;--bl:#cfeaff;--yl:#fff3c4;--ok:#2e9d4f;--ng:#e0563a;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#1d2230;--card:#2a3042;--tx:#f2f2f2;--bl:#25506b;--pk:#6b3a44;--yl:#6b5d25;--lb:#2f6f86}}
:root[data-theme="dark"]{--bg:#1d2230;--card:#2a3042;--tx:#f2f2f2;--bl:#25506b;--pk:#6b3a44;--yl:#6b5d25;--lb:#2f6f86}
*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--tx);font-family:"Hiragino Maru Gothic ProN","Yu Gothic",sans-serif;text-align:center}
#app{max-width:560px;margin:0 auto;padding:14px}
h1{font-size:22px;margin:10px 0}.sub{font-size:15px;margin-bottom:16px}
.btn{display:block;width:100%;margin:12px 0;padding:18px;font-size:20px;font-weight:bold;border:0;border-radius:18px;background:var(--blue);color:#fff;cursor:pointer;font-family:inherit}
.btn.alt{background:#f08a24}.btn.go{background:var(--ok)}
.pts{display:inline-block;background:var(--yl);padding:6px 16px;border-radius:20px;font-weight:bold}
.card{background:var(--card);border-radius:18px;padding:12px;margin:10px 0;box-shadow:0 2px 6px #0002}
.scene{display:flex;flex-wrap:wrap;gap:10px;justify-content:center}
.box{background:var(--lb);border:6px solid var(--blue);border-radius:6px;min-width:104px;min-height:84px;padding:6px;display:grid;grid-template-columns:repeat(3,1fr);gap:2px;align-content:center;font-size:30px;line-height:1.1}
.box.drop{cursor:pointer;min-width:110px;min-height:110px}
.tray{min-height:60px;font-size:32px;display:flex;flex-wrap:wrap;gap:6px;justify-content:center;background:var(--card);border-radius:14px;padding:8px}
.eq{display:flex;align-items:flex-end;justify-content:center;gap:6px;font-size:26px;margin:8px 0}
.col{display:flex;flex-direction:column;align-items:center;gap:4px}
.slot{width:54px;height:54px;border-radius:8px;display:flex;align-items:center;justify-content:center;font-weight:bold;font-size:30px;color:#222}
.s0{background:var(--bl)}.s1{background:var(--pk)}.s2{background:var(--yl)}
.slot.act{outline:4px solid #f08a24}
.bub{font-size:11px;padding:4px 7px;border-radius:14px;color:#222;border:2px solid #fff;box-shadow:0 1px 3px #0003;white-space:nowrap}
.q{font-size:20px;font-weight:bold;margin:8px 0;min-height:30px}
.msg{min-height:44px;font-size:16px;font-weight:bold}.ok{color:var(--ok)}.ng{color:var(--ng)}
.pad{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;max-width:320px;margin:8px auto}
.pad button{font-size:26px;padding:12px;border-radius:12px;border:2px solid var(--blue);background:var(--card);color:var(--tx);font-family:inherit;font-weight:bold}
.small{font-size:14px;color:inherit;opacity:.8}
.shake{animation:sh .3s}@keyframes sh{25%{transform:translateX(-6px)}75%{transform:translateX(6px)}}
.top{display:flex;justify-content:space-between;align-items:center;font-size:14px}
.back{background:none;border:0;color:var(--blue);font-size:14px;font-family:inherit}
rt{font-size:7px}
</style></head><body><div id="app"></div>
<script>
const EM=['🐥','🥚','🌸','🍓','🍎','🐟','⭐'];
const PRAISE=['さいごまで あきらめずに できたね！','かずを ていねいに かぞえられて すごい！','「1つ分」と「いくつ分」が よくわかっているね！','しきを つくるのが とても じょうずだよ！','もう かけざんはかせに ちかいね！'];
let total=0;try{total=+localStorage.getItem('kk_pts')||0}catch(e){}
function save(){try{localStorage.setItem('kk_pts',total)}catch(e){}}
const $=s=>document.getElementById(s);
const R=(a,b)=>a+Math.floor(Math.random()*(b-a+1));
const rb=(k,r)=>`<ruby>${k}<rt>${r}</rt></ruby>`;
const L=[`1つ${rb('分','ぶん')}の${rb('数','かず')}`,`いくつ${rb('分','ぶん')}`,`ぜんぶの${rb('数','かず')}`];
let S={};
function gen(){const used=new Set();const out=[];while(out.length<3){const a=R(2,6),b=R(2,5);if(used.has(a+'x'+b))continue;used.add(a+'x'+b);out.push({a,b,e:EM[R(0,EM.length-1)]})}return out}
function home(){
$('app').innerHTML=`<h1>はじめてのかけざん①<br>かけ算のいみを知ろう</h1><div class="pts">⭐ ポイント ${total}</div>
<div class="card"><div class="eq"><div class="col"><div class="slot s0">3</div></div>×<div class="col"><div class="slot s1">2</div></div>=<div class="col"><div class="slot s2">6</div></div></div><div class="small">1つ分 × いくつ分 ＝ ぜんぶの数</div></div>
<button class="btn" onclick="start(1)">① 絵を見て かけざんの しきにしよう！</button>
<button class="btn alt" onclick="start(2)">② しきを見て 絵を うごかそう！</button>`}
function start(m){S={m,qs:gen(),i:0,earned:0};m==1?q1():q2()}
function boxes(q,fill){return `<div class="scene">`+Array.from({length:q.b},()=>`<div class="box">${q.e.repeat(q.a).split(/(?=.)/u).join('')}</div>`).join('')+`</div>`}
function eqRow(v,act,fixed){return `<div class="eq">`+[0,1,2].map(k=>`<div class="col"><div class="slot s${k} ${act===k?'act':''}">${v[k]??''}</div><div class="bub s${k}">${L[k]}</div></div>${k==0?'×':k==1?'=':''}`).join('')+`</div>`}
function head(){return `<div class="top"><button class="back" onclick="home()">← ホーム</button><span>${S.i+1} / 3もんめ</span><span class="pts">⭐ ${total}</span></div>`}
// ---- mode 1
function q1(){const q=S.qs[S.i];S.step=0;S.v=[];S.buf='';S.mis=0;S.done=false;draw1('')}
const P1=['1つぶんは いくつ？','いくつ分 ある？','ぜんぶの数は いくつ？'];
function draw1(msg,cls){const q=S.qs[S.i];
const v=S.v.slice();if(S.step==2&&S.buf)v[2]=S.buf;
$('app').innerHTML=head()+`<div class="card">${boxes(q)}</div>`+eqRow(v,S.done?-1:S.step)+
(S.done?'':`<div class="q">${P1[S.step]}</div>`)+`<div class="msg ${cls||''}" id="msg">${msg}</div>`+
(S.done?`<button class="btn go" onclick="next1()">${S.i<2?'つぎの もんだい ▶':'けっかを見る ▶'}</button>`:pad())}
function pad(){return `<div class="pad">`+[1,2,3,4,5,6,7,8,9].map(n=>`<button onclick="key(${n})">${n}</button>`).join('')+`<button onclick="clr()">けす</button><button onclick="key(0)">0</button><button onclick="enter()">OK</button></div>`}
function wrong(){S.mis++;S.buf='';const h=['1つの はこに いくつ いるか かぞえてみよう','はこが いくつ あるか かぞえてみよう','1つ分 × いくつ分 を けいさんしてみよう'][S.step];draw1('おしい！ '+h,'ng');$('app').classList.remove('shake');void $('app').offsetWidth;$('app').classList.add('shake')}
function key(n){if(S.done)return;const q=S.qs[S.i];
if(S.step<2){if(n==(S.step==0?q.a:q.b)){S.v[S.step]=n;S.step++;S.buf='';draw1('せいかい！','ok')}else wrong()}
else{if(S.buf.length<2)S.buf+=n;draw1('')}}
function clr(){S.buf='';draw1('')}
function enter(){if(S.step<2||S.done||!S.buf)return;const q=S.qs[S.i];
if(+S.buf==q.a*q.b){S.v[2]=q.a*q.b;S.done=true;const p=S.mis==0?10:5;S.earned+=p;total+=p;save();
draw1(`⭕ せいかい！ ${q.a}こ ずつが ${q.b}はこぶん あるから、<br>${q.a} × ${q.b} ＝ ${q.a*q.b}　ぜんぶで ${q.a*q.b}こ！<br>+${p}ポイント`,'ok')}else wrong()}
function next1(){S.i++;S.i<3?q1():result()}
// ---- mode 2
function q2(){const q=S.qs[S.i];S.cnt=Array(q.b).fill(0);S.done=false;S.tries=0;draw2('')}
function draw2(msg,cls){const q=S.qs[S.i],c=q.a*q.b,placed=S.cnt.reduce((x,y)=>x+y,0);
$('app').innerHTML=head()+eqRow([q.a,q.b,c],-1)+
`<div class="q">${q.a}こずつ、${q.b}はこ に わけよう</div><div class="small">はこを タップすると 1こ入るよ。中の絵文字を タップすると もどるよ</div>`+
`<div class="card"><div class="small">のこり ${c-placed}こ</div><div class="tray">${q.e.repeat(c-placed)||'<span class="small">ぜんぶ つかったよ</span>'}</div></div>`+
`<div class="scene">`+S.cnt.map((n,i)=>`<div class="box drop" onclick="put(${i})">${Array.from({length:n},()=>`<span onclick="event.stopPropagation();take(${i})">${q.e}</span>`).join('')}</div>`).join('')+`</div>`+
`<div class="msg ${cls||''}">${msg}</div>`+
(S.done?`<button class="btn go" onclick="next2()">${S.i<2?'つぎの もんだい ▶':'けっかを見る ▶'}</button>`:`<button class="btn" onclick="chk()">できた！</button>`)}
function put(i){if(S.done)return;const q=S.qs[S.i],c=q.a*q.b;if(S.cnt.reduce((x,y)=>x+y,0)<c&&S.cnt[i]<9){S.cnt[i]++;draw2('')}}
function take(i){if(S.done)return;if(S.cnt[i]>0){S.cnt[i]--;draw2('')}}
function chk(){const q=S.qs[S.i];if(S.cnt.every(n=>n==q.a)){S.done=true;const p=S.tries==0?10:5;S.earned+=p;total+=p;save();
draw2(`⭕ せいかい！ 1つ分が ${q.a}こで、${q.b}つ分 あるから<br>${q.a} × ${q.b} ＝ ${q.a*q.b}　+${p}ポイント`,'ok')}else{S.tries++;
const pl=S.cnt.reduce((x,y)=>x+y,0);draw2(pl<q.a*q.b?'まだ のこっているよ。どの はこにも '+q.a+'こずつ 入れよう':'どの はこにも おなじ数ずつ、'+q.a+'こ入れよう','ng')}}
function next2(){S.i++;S.i<3?q2():result()}
function result(){const stars='⭐'.repeat(S.earned>=30?3:S.earned>=20?2:1);
$('app').innerHTML=`<h1>🎉 けっか 🎉</h1><div style="font-size:40px">${stars}</div><div class="card"><div class="q">${PRAISE[R(0,PRAISE.length-1)]}</div><div class="pts" style="font-size:22px">+${S.earned} ポイント！</div><p>ぜんぶで ⭐ ${total} ポイント</p></div><button class="btn go" onclick="start(${S.m})">もういちど あそぶ</button><button class="btn alt" onclick="home()">ホームへ</button>`}
home();
</script></body></html>

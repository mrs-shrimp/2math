```html
<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>2年生 さんすうゲーム</title>

  <style>
    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      font-family:
        "Hiragino Kaku Gothic ProN",
        "Yu Gothic",
        "Meiryo",
        sans-serif;
      background: #f5f8ff;
      color: #26344a;
    }

    a {
      text-decoration: none;
      color: inherit;
    }

    /* =========================
       ヘッダー
    ========================= */

    header {
      background: linear-gradient(
        135deg,
        #6ec6ff,
        #7c8cff
      );

      color: white;
      padding: 28px 20px 32px;
      text-align: center;

      box-shadow:
        0 4px 12px rgba(50, 80, 130, 0.15);
    }

    .site-title {
      margin: 0;
      font-size: clamp(28px, 5vw, 44px);
      font-weight: 800;
      letter-spacing: 0.08em;
      text-shadow:
        0 3px 0 rgba(0,0,0,0.08);
    }

    .site-subtitle {
      margin: 8px 0 0;
      font-size: 16px;
      font-weight: 600;
      opacity: 0.95;
    }

    /* =========================
       メイン
    ========================= */

    main {
      max-width: 1100px;
      margin: 0 auto;
      padding: 35px 20px 70px;
    }

    .intro {
      text-align: center;
      margin-bottom: 35px;
    }

    .intro-title {
      display: inline-block;
      margin: 0;
      padding: 10px 24px;
      background: white;
      border-radius: 999px;
      font-size: 22px;
      font-weight: 800;

      box-shadow:
        0 4px 15px rgba(70, 100, 150, 0.10);
    }

    .intro-text {
      margin: 12px 0 0;
      color: #64748b;
      font-size: 15px;
    }

    /* =========================
       カテゴリー
    ========================= */

    .category {
      margin-bottom: 42px;
    }

    .category-title {
      display: flex;
      align-items: center;
      gap: 12px;

      margin: 0 0 18px;

      font-size: 23px;
      font-weight: 800;
    }

    .category-icon {
      width: 42px;
      height: 42px;

      display: flex;
      align-items: center;
      justify-content: center;

      border-radius: 13px;

      background: #ffd85c;

      font-size: 23px;

      box-shadow:
        0 3px 0 rgba(0,0,0,0.08);
    }

    /* =========================
       ゲーム一覧
    ========================= */

    .game-grid {
      display: grid;
      grid-template-columns:
        repeat(auto-fit, minmax(220px, 1fr));
      gap: 20px;
    }

    /* =========================
       ゲームボタン
    ========================= */

    .game-button {
      position: relative;

      display: flex;
      align-items: center;
      justify-content: center;

      min-height: 180px;

      padding: 8px;

      background: white;

      border-radius: 24px;

      border: 3px solid transparent;

      box-shadow:
        0 7px 0 rgba(60, 80, 120, 0.12),
        0 10px 25px rgba(60, 80, 120, 0.08);

      transition:
        transform 0.15s ease,
        box-shadow 0.15s ease;

      overflow: hidden;
    }

    .game-button:hover {
      transform: translateY(-5px);

      box-shadow:
        0 11px 0 rgba(60, 80, 120, 0.12),
        0 15px 30px rgba(60, 80, 120, 0.12);
    }

    .game-button:active {
      transform: translateY(3px);

      box-shadow:
        0 3px 0 rgba(60, 80, 120, 0.12);
    }

    /* =========================
       ゲーム画像ボタン
    ========================= */

    .game-button img {
      display: block;

      width: 100%;
      height: 100%;

      max-height: 300px;

      object-fit: contain;

      border-radius: 18px;
    }

    /* =========================
       くくクエスト
    ========================= */

    .kuku-button {
      border-color: #ffd45c;
      background: #fffdf3;
    }

    /* =========================
       まだ画像がないゲーム
    ========================= */

    .coming-button {
      min-height: 180px;

      border-color: #d6deea;

      background:
        linear-gradient(
          135deg,
          #ffffff,
          #f3f6fb
        );

      color: #7b8798;

      text-align: center;
    }

    .coming-icon {
      font-size: 42px;
      margin-bottom: 8px;
    }

    .coming-name {
      font-size: 18px;
      font-weight: 800;
    }

    .coming-text {
      margin-top: 6px;
      font-size: 12px;
    }

    /* =========================
       フッター
    ========================= */

    footer {
      text-align: center;

      padding: 28px 20px;

      background: #26344a;
      color: white;
    }

    .copyright {
      font-size: 13px;
      opacity: 0.85;
    }

    /* =========================
       スマホ
    ========================= */

    @media (max-width: 600px) {

      header {
        padding: 22px 15px 26px;
      }

      main {
        padding: 25px 14px 50px;
      }

      .game-grid {
        grid-template-columns:
          repeat(2, 1fr);

        gap: 12px;
      }

      .game-button {
        min-height: 135px;
        border-radius: 18px;
      }

      .game-button img {
        border-radius: 14px;
      }

      .category-title {
        font-size: 20px;
      }

      .coming-button {
        min-height: 135px;
      }

      .coming-icon {
        font-size: 32px;
      }

      .coming-name {
        font-size: 15px;
      }
    }
  </style>
</head>


<body>

  <!-- =========================
       ヘッダー
  ========================== -->

  <header>

    <h1 class="site-title">
      2年生 さんすうゲーム
    </h1>

    <p class="site-subtitle">
      あそびながら、くり返し学ぼう！
    </p>

  </header>


  <!-- =========================
       メイン
  ========================== -->

  <main>

    <section class="intro">

      <h2 class="intro-title">
        どのゲームで あそぶ？
      </h2>

      <p class="intro-text">
        すきなゲームをえらんで、さんすうの力をのばそう！
      </p>

    </section>


    <!-- =========================
         数と計算
    ========================== -->

    <section class="category">

      <h2 class="category-title">

        <span class="category-icon">
          🔢
        </span>

        数と計算

      </h2>


      <div class="game-grid">


        <!-- くくクエスト -->

        <a
          href="https://mrs-shrimp.github.io/kuku-quest/"
          class="game-button kuku-button"
          aria-label="くくクエスト"
        >

          <img
            src="https://mrs-shrimp.github.io/2math/image/kuku.png"
            alt="くくクエスト"
          >

        </a>


        <!-- ひっ算バトル -->

        <div class="game-button coming-button">

          <div>

            <div class="coming-icon">
              ⚔️
            </div>

            <div class="coming-name">
              ひっ算バトル
            </div>

            <div class="coming-text">
              ボタン画像準備中
            </div>

          </div>

        </div>


      </div>

    </section>


    <!-- =========================
         図形
    ========================== -->

    <section class="category">

      <h2 class="category-title">

        <span class="category-icon">
          📐
        </span>

        図形

      </h2>


      <div class="game-grid">


        <!-- 三角形と四角形 -->

        <div class="game-button coming-button">

          <div>

            <div class="coming-icon">
              🔺
            </div>

            <div class="coming-name">
              三角形と四角形
            </div>

            <div class="coming-text">
              ボタン画像準備中
            </div>

          </div>

        </div>


      </div>

    </section>


  </main>


  <!-- =========================
       フッター
  ========================== -->

  <footer>

    <div class="copyright">
      © MRS EBISAWA
    </div>

  </footer>


</body>
</html>
```

<!DOCTYPE html>
<html lang="ja"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>けいさん おんどく</title>
<style>
:root{--bg:#fff8e7;--fg:#333;--card:#fff;--ac:#ff8a3d;--ok:#2e9e5b;--ng:#e5484d;--bd:#f0d9a8;--hint:#fff0d6;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#1e1b16;--fg:#f3eee2;--card:#2b2720;--bd:#4a4234;--hint:#3b3224}}
:root[data-theme="dark"]{--bg:#1e1b16;--fg:#f3eee2;--card:#2b2720;--bd:#4a4234;--hint:#3b3224}
*{box-sizing:border-box}
html,body{margin:0;background:var(--bg);color:var(--fg);font-family:"Hiragino Maru Gothic ProN","Yu Gothic",sans-serif}
body{min-height:100vh;display:flex;justify-content:center}
#app{width:100%;max-width:480px;padding:16px}
.scr{display:none;text-align:center}.scr.on{display:block}
h1{font-size:30px;margin:24px 0 8px}
.btn{display:block;width:100%;font-size:26px;font-weight:bold;padding:18px;margin:14px 0;border:none;border-radius:20px;background:var(--ac);color:#fff;cursor:pointer}
.btn.sub{background:#4a90d9}.btn.gr{background:#8a8a8a;font-size:20px;padding:12px}
.top{display:flex;justify-content:space-between;font-size:18px;font-weight:bold;margin-bottom:8px}
.card{background:var(--card);border:4px solid var(--bd);border-radius:24px;padding:20px 10px;margin:8px 0}
.q{font-size:64px;font-weight:bold;letter-spacing:2px}
.ans{font-size:56px;font-weight:bold;min-height:72px;border-bottom:4px solid var(--ac);width:60%;margin:6px auto}
.card.ok{border-color:var(--ok);background:#d9f5e3;color:#222}
.card.ng{animation:sh .3s;border-color:var(--ng)}
@keyframes sh{25%{transform:translateX(-10px)}75%{transform:translateX(10px)}}
.hint{background:var(--hint);border-radius:16px;padding:10px;font-size:20px;line-height:1.6;min-height:96px;margin:8px 0}
.hint b{font-size:26px;color:var(--ac)}
.pad{display:grid;grid-template-columns:repeat(5,1fr);gap:8px}
.pad button{font-size:30px;font-weight:bold;padding:14px 0;border-radius:14px;border:3px solid var(--bd);background:var(--card);color:var(--fg);cursor:pointer}
.pad button:active{background:var(--ac);color:#fff}
.big{font-size:44px;font-weight:bold;margin:10px 0}
table{width:100%;border-collapse:collapse;font-size:16px}td,th{padding:6px 4px;border-bottom:1px solid var(--bd)}
.wrap{overflow-x:auto}
</style></head><body><div id="app">
<div class="scr on" id="home"><h1>けいさん おんどく</h1><p>どっちを やる？</p>
<button class="btn" onclick="start('add')">たしざん</button>
<button class="btn sub" onclick="start('sub')">ひきざん</button>
<button class="btn gr" onclick="showRec()">きろくを みる</button></div>
<div class="scr" id="play"><div class="top"><span id="cnt"></span><span id="tm"></span></div>
<div class="card" id="card"><div class="q" id="q"></div><div class="ans" id="ans"></div></div>
<div class="hint" id="hint"></div>
<div class="pad" id="pad"></div>
<button class="btn gr" onclick="quit()">やめる</button></div>
<div class="scr" id="end"><h1>おつかれさま！</h1>
<div class="card"><div>ヒントなしで せいかい</div><div class="big" id="r1"></div><div>かかった じかん</div><div class="big" id="r2"></div></div>
<p>きろくに のこしたよ</p>
<button class="btn" id="again">もういちど</button>
<button class="btn gr" onclick="show('home')">ホームへ</button></div>
<div class="scr" id="rec"><h1>きろく</h1><div class="wrap" id="recbody"></div>
<button class="btn gr" onclick="show('home')">ホームへ</button></div>
</div>
<script>
const P=s=>s.split(' ').map(x=>x.split(/[+-]/).map(Number));
const ADD=P("9+7 6+9 7+5 9+2 8+6 4+7 5+9 9+4 3+9 7+8 8+8 2+9 4+8 7+6 9+5 8+3 9+3 8+5 7+9 9+6 3+8 7+7 5+7 8+4 6+5 4+9 9+8 8+7 9+9 6+8 5+6 5+8 7+4 6+6 8+9 6+7");
const SUB=P("14-9 12-4 17-8 11-3 14-5 16-8 11-2 14-6 16-9 12-8 13-7 17-9 12-3 11-9 15-6 13-5 12-7 11-4 15-9 11-7 14-8 16-7 15-7 18-9 13-9 12-5 13-8 11-5 12-6 11-8 12-9 13-4 13-6 15-8 11-6 14-7");
const KEY='keisan-ondoku-records';
let mode,qs,i,ok,wrong,hinted,locked,input,t0,qt0,timer,ans,ac;
const $=id=>document.getElementById(id);
function show(id){document.querySelectorAll('.scr').forEach(e=>e.classList.remove('on'));$(id).classList.add('on')}
$('pad').innerHTML=[1,2,3,4,5,6,7,8,9,0].map(n=>`<button onclick="press(${n})">${n}</button>`).join('')+'';
$('pad').insertAdjacentHTML('beforeend','');
function beep(f,d,t='sine',s=0){try{ac=ac||new (window.AudioContext||window.webkitAudioContext)();const o=ac.createOscillator(),g=ac.createGain();o.type=t;o.frequency.value=f;g.gain.value=.2;o.connect(g);g.connect(ac.destination);const n=ac.currentTime+s;o.start(n);o.stop(n+d)}catch(e){}}
const pinpon=()=>{beep(988,.25,'sine',0);beep(784,.4,'sine',.25)};
const buzz=()=>beep(160,.3,'sawtooth');
function start(m){mode=m;qs=[...(m=='add'?ADD:SUB)].sort(()=>Math.random()-.5);i=0;ok=0;wrong=0;t0=Date.now();$('again').onclick=()=>start(m);show('play');clearInterval(timer);timer=setInterval(tick,200);next()}
function fmt(ms){const s=Math.round(ms/1000);return Math.floor(s/60)+'ぷん'+(s%60)+'びょう'}
function tick(){$('tm').textContent=fmt(Date.now()-t0);if(!hinted&&!locked&&Date.now()-qt0>=10000)showHint()}
function next(){if(i>=qs.length)return finish();const[a,b]=qs[i];ans=mode=='add'?a+b:a-b;input='';hinted=false;locked=false;qt0=Date.now();
$('q').textContent=a+(mode=='add'?' ＋ ':' － ')+b+' ＝ ？';$('ans').textContent='';$('card').className='card';$('cnt').textContent=(i+1)+' / '+qs.length;
$('hint').innerHTML='<small>10びょう こまったら ヒントが でるよ</small>'}
function press(d){if(locked)return;try{beep(0,0)}catch(e){}input+=d;$('ans').textContent=input;const s=String(ans);
if(input===s){locked=true;if(!hinted)ok++;pinpon();$('card').className='card ok';i++;setTimeout(next,600)}
else if(input.length>=s.length){wrong++;buzz();$('card').className='card ng';setTimeout(()=>{if(!locked){input='';$('ans').textContent='';$('card').className='card'}},350)}}
function showHint(){hinted=true;let[a,b]=qs[i],h;
if(mode=='add'){const base=Math.max(a,b),m=Math.min(a,b),n=10-base,r=m-n;
h=`${m}を <b>${n}</b>と<b>${r}</b>に わけて<br><b>${base}＋${n}＋${r}</b> って かんがえると…？<br><small>まず ${base}＋${n}＝10 だね</small>`}
else{const o=a-10,r=b-o;
h=`${b}を <b>${o}</b>と<b>${r}</b>に わけて<br><b>${a}－${o}－${r}</b> って かんがえると…？<br><small>まず ${a}－${o}＝10 だね</small>`}
$('hint').innerHTML=h}
function finish(){clearInterval(timer);const ms=Date.now()-t0;$('r1').textContent=ok+' / '+qs.length;$('r2').textContent=fmt(ms);
try{const r=JSON.parse(localStorage.getItem(KEY)||'[]');r.unshift({d:new Date().toISOString(),m:mode,ok,n:qs.length,ms,w:wrong});localStorage.setItem(KEY,JSON.stringify(r.slice(0,100)))}catch(e){}
show('end')}
function quit(){clearInterval(timer);show('home')}
function showRec(){let r=[];try{r=JSON.parse(localStorage.getItem(KEY)||'[]')}catch(e){}
$('recbody').innerHTML=r.length?'<table><tr><th>にちじ</th><th></th><th>せいかい</th><th>じかん</th></tr>'+r.map(x=>`<tr><td>${new Date(x.d).toLocaleString('ja-JP',{month:'numeric',day:'numeric',hour:'2-digit',minute:'2-digit'})}</td><td>${x.m=='add'?'たし':'ひき'}</td><td>${x.ok}/${x.n}</td><td>${fmt(x.ms)}</td></tr>`).join('')+'</table>':'<p>まだ きろくが ないよ</p>';show('rec')}
</script></body></html>

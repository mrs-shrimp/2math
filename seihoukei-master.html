<!DOCTYPE html><html lang="ja"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><title>正方形マスター</title>
<style>
:root{color-scheme:light;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}

</style></head><body><div id="app"></div><script>
const $=s=>document.querySelector(s),R=(a,b)=>a+Math.random()*(b-a),RI=(a,b)=>Math.floor(R(a,b+1)),pick=a=>a[RI(0,a.length-1)],sh=a=>a.map(x=>[Math.random(),x]).sort((p,q)=>p[0]-q[0]).map(p=>p[1]);
let S={u:1,st:{},b2:0},tid;try{Object.assign(S,JSON.parse(localStorage.getItem('sqk1')))}catch(e){}
const save=()=>{try{localStorage.setItem('sqk1',JSON.stringify(S))}catch(e){}};
let AC;const beep=(f,d=.12)=>{try{AC=AC||new AudioContext();const o=AC.createOscillator(),g=AC.createGain();o.frequency.value=f;o.connect(g);g.connect(AC.destination);g.gain.value=.1;o.start();o.stop(AC.currentTime+d)}catch(e){}};
const ok=()=>{beep(660);setTimeout(()=>beep(880),110)},ng=()=>beep(200,.25);
const btn=(t,c,f)=>{const b=document.createElement('button');b.textContent=t;b.className=c||'';b.onclick=f;return b};
const FB='<svg class="c" viewBox="0 0 76 76"><polygon points="8,8 8,68 68,68" fill="#ffd166" stroke="#e09f00" stroke-width="4" stroke-linejoin="round"/><path d="M8 50h14v18" fill="none" stroke="#e63946" stroke-width="3"/><circle cx="22" cy="48" r="3"/><circle cx="36" cy="58" r="3"/></svg>';
function ckImg(){const i=new Image();i.src='https://mrs-shrimp.github.io/2math/image/chokkakun.png';i.onerror=()=>{const d=document.createElement('span');d.innerHTML=FB;i.replaceWith(d.firstChild)};return i}
function page(m){clearInterval(tid);$('#app').innerHTML='<div id="ck"><span id="cki"></span><div id="bub"></div></div><div id="hd"></div><div id="q"></div><div id="fb"></div>';$('#cki').append(ckImg());say(m)}
const say=t=>{$('#bub').textContent=t};
// ---- shapes
const nv=(a,v)=>{const x=a[0]-v[0],y=a[1]-v[1],l=Math.hypot(x,y);return[x/l,y/l]};
const TL=[[1,0],[1,0],[1,0],[1,1],[2,1],[1,2]];
function mk(k){let p,t;const w=RI(3,6),h=RI(2,4),W=w+2,s=RI(1,3);
 if(k=='s'||k=='r'){const tl=Math.random()<.35?pick(TL.slice(3)):TL[0],a=tl[0],b=tl[1],bg=a+b==1,m=bg?RI(2,6):RI(1,2);let n=m;if(k=='r'){n=bg?RI(2,6):RI(1,2);if(n==m)n=bg?(m<6?m+1:m-1):3-m}
  p=[[0,0],[a*m,b*m],[a*m-b*n,b*m+a*n],[-b*n,a*n]]}
 else{t=pick(['pa','pa','rt','tr','ki','ri','ni']);p={pa:[[0,0],[W,0],[W+s,h],[s,h]],rt:[[0,0],[W-2,0],[W,h],[0,h]],tr:[[1,0],[W-1,0],[W+1,h],[-1,h]],ki:[[0,-3],[2,0],[0,h],[-2,0]],ri:[[-W,0],[0,-h],[W,0],[0,h]],ni:[[0,0],[W,0],[W+1,h],[0,h]]}[t]}
 return{k,p,t}}
const PX=o=>{const X=o.p.map(q=>q[0]),Y=o.p.map(q=>q[1]),x0=Math.min(...X),x1=Math.max(...X),y0=Math.min(...Y),y1=Math.max(...Y),c=Math.min(36,Math.floor(230/Math.max(x1-x0,y1-y0,1))),ox=150-(x0+x1)/2*c,oy=150-(y0+y1)/2*c;return{c,ox,oy,P:o.p.map(q=>[ox+q[0]*c,oy+q[1]*c])}};
let RC=0;
function sv(o,marks,col){const{c,ox,oy,P}=PX(o);let g='',m='';RC=0;
 for(let k=-40;k<=40;k++){const x=ox+k*c,y=oy+k*c;if(x>=0&&x<=300)g+=`M${x} 0V300`;if(y>=0&&y<=300)g+=`M0 ${y}H300`}
 P.forEach((v,i)=>{const u=nv(P[(i+3)%4],v),w=nv(P[(i+1)%4],v);if(Math.abs(u[0]*w[0]+u[1]*w[1])<.03){RC++;const d=Math.max(10,c/2);if(marks)m+=`<path d="M${v[0]+u[0]*d} ${v[1]+u[1]*d}L${v[0]+(u[0]+w[0])*d} ${v[1]+(u[1]+w[1])*d}L${v[0]+w[0]*d} ${v[1]+w[1]*d}" fill="none" stroke="#e63946" stroke-width="4"/>`}});
 return`<path d="${g}" stroke="#b8d4e8" stroke-width="1" fill="none"/><polygon points="${P.join(' ')}" fill="${col||'rgba(76,201,240,.45)'}" stroke="#1d3557" stroke-width="3" stroke-linejoin="round"/>${m}`}
// ---- run
function run(id,qs,need){let i=0,c=0,cb=0;const n=()=>{if(i>=qs.length)return end(id,c,qs.length,need);page('よく みてね！');$('#hd').textContent=`もんだい ${i+1}/${qs.length}　⭐${c} ${cb>1?'🔥'+cb+'れんぞく！':''}`;
 qs[i]($('#q'),(good,msg,corner)=>{good?(c++,cb++,ok()):(cb=0,ng());$('#fb').innerHTML=`<p>${msg||''}</p>`;
  say(corner?'直角だぁ！気持ちいい⤴💗':good?(cb>=3?cb+'れんぞく！すごすぎる！':pick(['せいかい！','いいね！','すごい！'])):pick(['おしい！つぎは できるよ','よく みて たしかめよう']));
  $('#fb').append(btn('つぎへ ▶','g',()=>{i++;n()}))})};n()}
function end(id,c,n,need){const p=c>=need,r=c/n;result(id,p,r>=.9?3:r>=.7?2:1,`${n}もん中 ${c}もん せいかい！`+(p?'':`（${need}もん せいかいで クリア）`),()=>$('#q')&&0,id)}
function result(id,pass,stars,txt){const was=S.u;if(pass){S.st[id]=Math.max(S.st[id]||0,stars);if(id<6&&S.u<id+1)S.u=id+1;save()}
 page(pass?'やったね！':'もういちど ちょうせん！');const tips=['正方形は 4つの かどが 直角で、4つの へんが ぜんぶ おなじ ながさ','長方形は 直角が 4つ。でも へんの ながさが ちがうよ','方眼の ますを かぞえると ながさが わかるよ','へんが ぜんぶ おなじでも 直角が なければ 正方形じゃないよ'];
 $('#q').innerHTML=`<h2>${pass?'⭐'.repeat(stars)+'☆'.repeat(3-stars):'ざんねん…'}</h2><p>${txt}</p>${pass&&S.u>was?`<h3>🎉 モード${S.u}が ひらいたよ！</h3>`:''}<p>💡 ${pick(tips)}</p>`;
 $('#q').append(btn('もういちど','b',()=>start(id)),btn('ホーム','',home))}
// ---- questions
const qJudge=(box,done)=>{const sp=mk(pick(['s','s','s','s','r','r','o','o'])),rs=[];let sel=-1,dr=null;
 box.innerHTML=`<div>この かたちは 正方形かな？<br><small>方眼の ますを かぞえてみよう</small></div><svg id="bd" viewBox="0 0 300 300" width="300"><g id="shp">${sv(sp)}</g><g id="rl"></g></svg><div id="tb"></div><div id="an"></div>`;
 const bd=$('#bd'),draw=()=>$('#rl').innerHTML=rs.map(r=>`<g transform="translate(${r.x} ${r.y}) rotate(${r.a})"><polygon points="0,0 120,0 0,120" fill="rgba(255,193,7,.55)" stroke="#b07d00" stroke-width="2"/><path d="M0 22h22V0" fill="none" stroke="#e63946" stroke-width="2"/></g>`).join(''),
 pt=e=>{const p=bd.createSVGPoint();p.x=e.clientX;p.y=e.clientY;const q=p.matrixTransform(bd.getScreenCTM().inverse());return[q.x,q.y]};
 bd.onpointerdown=e=>{const g=e.target.closest('#rl g');if(!g)return;const k=[...$('#rl').children].indexOf(g),r=rs.splice(k,1)[0],q=pt(e);rs.push(r);sel=rs.length-1;dr=[q[0]-r.x,q[1]-r.y];bd.setPointerCapture(e.pointerId);draw()};
 bd.onpointermove=e=>{if(!dr)return;const q=pt(e),r=rs[sel];r.x=q[0]-dr[0];r.y=q[1]-dr[1];draw()};bd.onpointerup=()=>dr=null;
 const rot=d=>{if(sel>=0&&rs[sel]){rs[sel].a+=d;draw()}},tb=$('#tb');
 let ci=0;const PP=PX(sp).P;
 const chk=()=>{const i=ci++%4,v=PP[i],u=nv(PP[(i+3)%4],v),w=nv(PP[(i+1)%4],v),d=u[0]*w[1]-u[1]*w[0]>0?u:w,ta=Math.atan2(d[1],d[0])*180/Math.PI,r={x:12,y:12,a:0},x0=12,y0=12;rs.push(r);sel=rs.length-1;let t0=null;
  const stp=T=>{if(!bd.isConnected)return;t0=t0||T;const k=Math.min((T-t0)/500,1),e=1-Math.pow(1-k,3);r.x=x0+(v[0]-x0)*e;r.y=y0+(v[1]-y0)*e;r.a=ta*e;draw();if(k<1)requestAnimationFrame(stp);else{const rt=Math.abs(u[0]*w[0]+u[1]*w[1])<.03;rt?ok():ng();say(rt?'ぴったり！直角だぁ！気持ちいい⤴💗':'すきまが あるよ…ここは 直角じゃない！')}};requestAnimationFrame(stp)};
 tb.append(btn('📐 直角があるか しらべる','b',chk),btn('↺','b',()=>rot(-15)),btn('↻','b',()=>rot(15)),btn('🗑','b',()=>{if(sel>=0){rs.splice(sel,1);sel=rs.length-1;draw()}}));
 const ans=a=>{$('#an').innerHTML='';$('#shp').innerHTML=sv(sp,1);const good=a===(sp.k=='s');done(good,sp.k=='s'?'直角が 4つで、へんも ぜんぶ おなじ ながさ！ 正方形だよ':sp.k=='r'?'直角は 4つ だけど、へんの ながさが ちがうよ。長方形で 正方形じゃないよ':sp.t=='ri'?'へんは おなじ ながさだけど 直角が ないよ':`直角は ${RC}こ だけ。正方形は 直角が 4つ いるよ`,good&&sp.k=='s')};
 $('#an').append(btn('○ 正方形！','g',()=>ans(true)),btn('× ちがう','r',()=>ans(false)))};
const qPick=(box,done)=>{const L=sh([mk('s'),mk('r'),mk(pick(['r','o'])),mk('o')]);box.innerHTML='<div>正方形は どれ？</div><div id="pg" style="display:grid;grid-template-columns:1fr 1fr;gap:8px">'+L.map((o,i)=>`<svg class="t" data-i="${i}" viewBox="0 0 300 300">${sv(o)}</svg>`).join('')+'</div>';
 $('#pg').onclick=e=>{const s=e.target.closest('svg');if(!s)return;const o=L[+s.dataset.i],g=o.k=='s';$('#pg').onclick=null;[...$('#pg').children].forEach((v,i)=>v.innerHTML=sv(L[i],1));s.style.borderColor=g?'#2a9d4a':'#e63946';done(g,g?'直角が 4つで へんも おなじ！ 正方形だね':'それは 正方形じゃないよ。へんの ながさと 直角を たしかめよう',g)}};
const qSort=(box,done)=>{const ns=RI(2,4),L=sh([...Array.from({length:ns},()=>mk('s')),...Array.from({length:6-ns},()=>mk('r'))]),dn=[],sm=[];let sel=-1,miss=0,cs=0,cr=0;
 box.innerHTML='<div>ずけいを タップして、あう ばこに いれよう</div><div id="sg" style="display:grid;grid-template-columns:repeat(3,1fr);gap:6px"></div><div id="sb"></div>';
 const d=()=>{$('#sg').innerHTML=L.map((o,i)=>`<svg class="t" data-i="${i}" viewBox="0 0 300 300" style="${i==sel?'border-color:#fb8500':''}">${dn[i]?'<text x="150" y="195" font-size="120" text-anchor="middle">✅</text>':sv(o,sm[i])}</svg>`).join('');
  $('#sb').innerHTML='';$('#sb').append(btn(`🟦 正方形ばこ（${cs}）`,'b',()=>put(1)),btn(`🟧 長方形ばこ（${cr}）`,'',()=>put(0)))},
 put=q=>{if(sel<0)return say('さきに ずけいを タップしてね');const o=L[sel];if((o.k=='s')==!!q){dn[sel]=1;q?cs++:cr++;ok();sel=-1;say(pick(['ぴったり！','いいね！']))}else{miss=1;sm[sel]=1;ng();say('ちがうよ。赤い□が 直角のしるし。へんの ながさも くらべてね')}
  d();if(dn.filter(x=>x).length==6){$('#sb').innerHTML='';done(!miss,'ぜんぶ しわけられたね！',false)}};
 $('#sg').onclick=e=>{const s=e.target.closest('svg');if(!s)return;const i=+s.dataset.i;if(dn[i])return;sel=i;d()};d()};
const bb=s=>{const a=[...s].map(k=>k.split(',').map(Number)),X=a.map(q=>q[0]),Y=a.map(q=>q[1]),x0=Math.min(...X),y0=Math.min(...Y);return{x0,y0,w:Math.max(...X)-x0+1,h:Math.max(...Y)-y0+1}};
function grid(host,C,Rw,lock,init,chg){const z=34,set=new Set(init),L=new Set(lock);host.innerHTML=`<svg viewBox="0 0 ${C*z+4} ${Rw*z+4}" width="${C*z+4}"></svg>`;const el=host.firstChild,
 d=()=>{let h='';for(let y=0;y<Rw;y++)for(let x=0;x<C;x++){const k=x+','+y,on=set.has(k);h+=`<rect data-k="${k}" x="${x*z+2}" y="${y*z+2}" width="${z}" height="${z}" fill="${on?L.has(k)?'#8ecae6':'#ffb703':'#fff'}" stroke="#aaa"/>`}el.innerHTML=h;chg&&chg(set)};
 el.onclick=e=>{const k=e.target.dataset.k;if(!k||L.has(k))return;set.has(k)?set.delete(k):set.add(k);d()};d();return set}
const qBuild=(box,done)=>{const a=RI(2,5),byc=Math.random()<.5,N=a*a;let miss=0;box.innerHTML=`<div>${byc?`1つの へんが ${a}こ の 正方形を つくろう`:`タイルを ${N}こ つかって 正方形を つくろう`}<br><small>（1cm×1cm のタイル。タップで おく／とる）</small></div><div id="gh"></div><div>いま <b id="cn">0</b>こ</div><div id="an"></div>`;
 const set=grid($('#gh'),9,7,[],[],s=>$('#cn')&&($('#cn').textContent=s.size));
 $('#an').append(btn('できた！','g',()=>{if(!set.size)return;const o=bb(set);if(set.size==N&&o.h==a&&o.w==a){$('#an').innerHTML='';done(!miss,`${a}×${a}=${N}こ！ 正方形が できた`,true)}else{miss=1;ng();say(set.size==o.w*o.h&&o.w!=o.h?'長方形だけど たてと よこが ちがうよ':'まだ 正方形に なってないよ')}}))};
const qFix=(box,done)=>{const a=RI(3,5),b=a,ox=RI(0,9-b),oy=RI(0,7-a),full=new Set(),rm=new Set();let miss=0;
 for(let y=0;y<a;y++)for(let x=0;x<b;x++)full.add((ox+x)+','+(oy+y));
 if(Math.random()<.5){const p=RI(1,2),q=RI(1,2),cx=pick([0,b-q]),cy=pick([0,a-p]);for(let y=0;y<p;y++)for(let x=0;x<q;x++)rm.add((ox+cx+x)+','+(oy+cy+y))}else{const f=[...full];while(rm.size<RI(2,4))rm.add(pick(f))}
 const lk=[...full].filter(k=>!rm.has(k));box.innerHTML='<div>タイルを たして 正方形に なおそう<br><small>（水色は うごかせないよ）</small></div><div id="gh"></div><div id="an"></div>';
 const set=grid($('#gh'),9,7,lk,lk);
 $('#an').append(btn('できた！','g',()=>{const ex=[...set].some(k=>!full.has(k));if(!ex&&set.size==full.size){$('#an').innerHTML='';done(!miss,`${a}×${a}の 正方形に なおせたね`,true)}else{miss=1;ng();say(ex?'ひろげすぎかも。いちばん ちいさい 正方形に してね':'まだ たりないところが あるよ')}}))};
// ---- time attack
function timeAtk(){let t=60,sc=0;const nb=()=>{const k=RI(3,4);return sh([...Array.from({length:k},()=>mk('s')),...Array.from({length:9-k},(_,j)=>mk(j<3?'r':'o'))])};let bd=nb();page('正方形を ぜんぶ タップ！ ぜんぶ みつけたら あたらしくなるよ（まちがい -3びょう）');
 $('#q').innerHTML='<div id="tm" style="font-size:22px"></div><div id="bg" style="display:grid;grid-template-columns:repeat(3,1fr);gap:6px"></div>';
 const d=()=>{$('#tm').textContent=`⏱ ${Math.max(t,0)}びょう　⭐ ${sc}`;$('#bg').innerHTML=bd.map((o,i)=>`<svg class="t" data-i="${i}" viewBox="0 0 300 300">${o?sv(o):'<text x="150" y="195" font-size="120" text-anchor="middle">✅</text>'}</svg>`).join('')},
 fin=()=>{clearInterval(tid);S.b2=Math.max(S.b2,sc);save();result(2,sc>=12,sc>=20?3:sc>=16?2:1,`${sc}こ みつけた！（ベスト ${S.b2}こ ／ 12こで クリア）`)};d();
 tid=setInterval(()=>{t--;if(t<=0)fin();else d()},1000);
 $('#bg').onclick=e=>{const s=e.target.closest('svg');if(!s||t<=0)return;const i=+s.dataset.i;if(!bd[i])return;if(bd[i].k=='s'){sc++;ok();bd[i]=null;if(!bd.some(o=>o&&o.k=='s')){bd=nb();say('ぜんぶ みつけた！あたらしい ずけいだよ✨')}else say(sc%5==0?'直角だぁ！気持ちいい⤴💗':pick(['ナイス！','はやい！','いいぞ！']))}else{t-=3;ng();say('ざんねん！-3びょう')}if(t<=0)fin();else d()};
 $('#fb').append(btn('やめる','r',home))}
// ---- home
function start(id){[0,()=>run(1,Array(10).fill(qJudge),8),timeAtk,()=>run(3,[qSort,qSort,qSort],0),()=>run(4,Array(5).fill(qBuild),0),()=>run(5,Array(5).fill(qFix),0),()=>run(6,sh([qJudge,qJudge,qJudge,qPick,qPick,qSort,qBuild,qBuild,qFix,qFix]),8)][id]()}
function home(){page('いっしょに 正方形マスターに なろう！');const N=['正方形かな？','正方形を さがそう（タイムアタック）','正方形と 長方形を しわけよう','正方形を つくろう','正方形に なおそう','正方形マスター'];
 $('#q').innerHTML='<h2>🟦 正方形マスター</h2>';N.forEach((n,i)=>{const id=i+1,b=btn((S.u>=id?'':'🔒 ')+id+'. '+n+'　'+('⭐'.repeat(S.st[id]||0)),id==6?'r':'b',()=>start(id));b.className+=' m';b.disabled=S.u<id;$('#q').append(b)})}
home();
</script></body></html>
